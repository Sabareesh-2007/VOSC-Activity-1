<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe | VOSC Activity-1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>

    <section class="options" aria-label="Game options">
      <label>Mode
        <select id="mode" autocomplete="off">
          <option value="pvp">Two players</option>
          <option value="cpu">Vs computer</option>
        </select>
      </label>
      <label id="difficulty-label" hidden>Difficulty
        <select id="difficulty" autocomplete="off">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
        </select>
      </label>
    </section>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score x"><span>Player X</span><strong id="score-x">0</strong></div>
      <div class="score draw"><span>Draws</span><strong id="score-draw">0</strong></div>
      <div class="score o"><span id="label-o">Player O</span><strong id="score-o">0</strong></div>
    </section>

    <p id="status" role="status" aria-live="polite">Player X's turn</p>

    <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" aria-label="Row 1, column 1"></button>
      <button class="cell" data-index="1" aria-label="Row 1, column 2"></button>
      <button class="cell" data-index="2" aria-label="Row 1, column 3"></button>
      <button class="cell" data-index="3" aria-label="Row 2, column 1"></button>
      <button class="cell" data-index="4" aria-label="Row 2, column 2"></button>
      <button class="cell" data-index="5" aria-label="Row 2, column 3"></button>
      <button class="cell" data-index="6" aria-label="Row 3, column 1"></button>
      <button class="cell" data-index="7" aria-label="Row 3, column 2"></button>
      <button class="cell" data-index="8" aria-label="Row 3, column 3"></button>
    </div>

    <div class="actions">
      <button id="new-round" class="btn">New round</button>
      <button id="reset-scores" class="btn secondary">Reset scores</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
